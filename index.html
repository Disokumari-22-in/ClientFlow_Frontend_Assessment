<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientFlow | Enquiry Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">CF</div>
        <div><strong>ClientFlow</strong><small>Business Operations</small></div>
      </div>
      <nav>
        <button class="nav-link active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-link" data-view="enquiries"><span>▤</span> Enquiries</button>
        <button class="nav-link" data-view="followups"><span>◷</span> Follow-ups</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="mini-card">
          <span class="dot"></span>
          <div><b>System ready</b><small>Mock data enabled</small></div>
        </div>
        <button class="nav-link" data-view="settings"><span>⚙</span> Settings</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Track your client enquiry pipeline.</p>
        </div>
        <button class="primary-btn" id="addTopBtn">+ New Enquiry</button>
      </header>

      <section id="appContent"></section>
    </main>
  </div>

  <div class="modal-backdrop-custom" id="modal">
    <div class="modal-card">
      <div class="modal-head">
        <div><h2 id="modalTitle">New Enquiry</h2><p>Capture client information and next action.</p></div>
        <button class="close-btn" id="closeModal">×</button>
      </div>
      <form id="enquiryForm">
        <input type="hidden" id="editId">
        <div class="form-grid">
          <label>Client / Company Name *<input id="company" required placeholder="e.g. ABC Technologies"></label>
          <label>Contact Person *<input id="contact" required placeholder="Full name"></label>
          <label>Email *<input id="email" type="email" required placeholder="name@company.com"></label>
          <label>Phone *<input id="phone" required pattern="[0-9+ ()-]{8,}" placeholder="+91 98765 43210"></label>
          <label>Enquiry Source
            <select id="source"><option>Website</option><option>WhatsApp</option><option>Instagram</option><option>Email</option><option>Referral</option><option>Direct</option></select>
          </label>
          <label>Service / Requirement<input id="service" required placeholder="Web Development"></label>
          <label>Estimated Budget<input id="budget" type="number" min="0" placeholder="50000"></label>
          <label>Status
            <select id="status"><option>New</option><option>Contacted</option><option>Qualified</option><option>Proposal Sent</option><option>Negotiation</option><option>Won</option><option>Lost</option></select>
          </label>
          <label>Assigned Person<input id="assigned" required placeholder="Team member"></label>
          <label>Next Follow-up Date<input id="followup" type="date"></label>
          <label class="full">Requirement Description<textarea id="description" rows="3" placeholder="Describe the client's requirement..."></textarea></label>
          <label class="full">Additional Notes<textarea id="notes" rows="2" placeholder="Notes for the team..."></textarea></label>
        </div>
        <div class="form-error" id="formError"></div>
        <div class="modal-actions"><button type="button" class="secondary-btn" id="cancelBtn">Cancel</button><button class="primary-btn" type="submit">Save Enquiry</button></div>
      </form>
    </div>
  </div>

  <div class="toast-custom" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
